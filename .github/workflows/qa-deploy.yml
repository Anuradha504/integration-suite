name: CPI Enterprise QA Deployment

on:
  workflow_dispatch:
    inputs:
      packageId:
        description: 'CPI Package ID'
        required: true
      artifactId:
        description: 'CPI Artifact ID (iFlow)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2: Install jq
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # STEP 3: Show Inputs
      - name: Show Inputs
        run: |
          echo "Package ID: ${{ github.event.inputs.packageId }}"
          echo "Artifact ID: ${{ github.event.inputs.artifactId }}"

      # STEP 4: Locate ZIP
      - name: Locate Artifact
        run: |
          echo "Searching for ZIP file..."
          FILE_PATH=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$FILE_PATH" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found: $FILE_PATH"
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

      # STEP 5: Get OAuth Token (FINAL FIX)
      - name: Get CPI OAuth Token
        id: token
        run: |
          echo "Preparing credentials safely..."

          CLIENT_ID="${{ secrets.CPI_CLIENT_ID }}"
          CLIENT_SECRET="${{ secrets.CPI_CLIENT_SECRET }}"

          BASIC_AUTH=$(printf "%s:%s" "$CLIENT_ID" "$CLIENT_SECRET" | base64)

          echo "Requesting token..."

          RESPONSE=$(curl -s --fail -X POST "${{ secrets.CPI_TOKEN_URL }}" \
            -H "Authorization: Basic $BASIC_AUTH" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials")

          echo "Token Response:"
          echo "$RESPONSE"

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Failed to generate token"
            exit 1
          fi

          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      # STEP 6: Deploy iFlow
      - name: Deploy iFlow to CPI
        run: |
          echo "Uploading iFlow to CPI..."

          curl -s --fail -X POST "${{ secrets.CPI_HOST }}/api/v1/IntegrationDesigntimeArtifacts" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/zip" \
            --data-binary @"$FILE_PATH"

      # STEP 7: Activate iFlow
      - name: Activate iFlow
        run: |
          echo "Activating iFlow..."

          curl -s --fail -X POST "${{ secrets.CPI_HOST }}/api/v1/IntegrationRuntimeArtifacts/${{ github.event.inputs.artifactId }}/deploy" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}"

      # STEP 8: Summary
      - name: Deployment Summary
        run: |
          echo "======================================"
          echo "CPI DEPLOYMENT SUCCESSFUL"
          echo "Package: ${{ github.event.inputs.packageId }}"
          echo "Artifact: ${{ github.event.inputs.artifactId }}"
          echo "======================================"
