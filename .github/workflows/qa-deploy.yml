name: CPI Enterprise QA Deployment

on:
  workflow_dispatch:
    inputs:
      packageId:
        description: 'CPI Package ID'
        required: true
      artifactId:
        description: 'CPI Artifact ID (iFlow)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2: Install jq
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # STEP 3: Show Inputs
      - name: Show Inputs
        run: |
          echo "Package ID: ${{ github.event.inputs.packageId }}"
          echo "Artifact ID: ${{ github.event.inputs.artifactId }}"

      # STEP 4: Debug Repo (optional but helpful)
      - name: Debug Repository Structure
        run: |
          echo "---- ROOT FILES ----"
          ls
          echo "---- FULL STRUCTURE ----"
          ls -R

      # STEP 5: Locate Artifact (AUTO DETECT - FIXED)
      - name: Locate Artifact
        run: |
          echo "Searching for ZIP file..."

          FILE_PATH=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$FILE_PATH" ]; then
            echo "ERROR: No ZIP file found in repository!"
            exit 1
          fi

          echo "Found ZIP at: $FILE_PATH"
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

      # STEP 6: Get OAuth Token
      - name: Get CPI OAuth Token
        id: token
        run: |
          echo "Requesting CPI OAuth token..."

          RESPONSE=$(curl -s -X POST "${{ secrets.CPI_TOKEN_URL }}" \
            --user "${{ secrets.CPI_CLIENT_ID }}:${{ secrets.CPI_CLIENT_SECRET }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials")

          echo "Token Response:"
          echo "$RESPONSE"

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Failed to generate token"
            exit 1
          fi

          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      # STEP 7: Deploy iFlow (UPLOAD ZIP)
      - name: Deploy iFlow to CPI
        run: |
          echo "Uploading iFlow ZIP to CPI..."

          curl -X POST "${{ secrets.CPI_HOST }}/api/v1/IntegrationDesigntimeArtifacts" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/zip" \
            --data-binary @"$FILE_PATH"

      # STEP 8: Activate iFlow
      - name: Activate iFlow
        run: |
          echo "Activating iFlow..."

          curl -X POST "${{ secrets.CPI_HOST }}/api/v1/IntegrationRuntimeArtifacts/${{ github.event.inputs.artifactId }}/deploy" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}"

      # STEP 9: Summary
      - name: Deployment Summary
        run: |
          echo "======================================"
          echo "CPI DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "Package ID: ${{ github.event.inputs.packageId }}"
          echo "Artifact ID: ${{ github.event.inputs.artifactId }}"
          echo "======================================"
