name: CPI Enterprise QA Deployment

on:
  workflow_dispatch:
    inputs:
      packageId:
        required: true
      artifactId:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y jq

      - run: |
          FILE_PATH=$(find . -type f -name "*.zip" | head -n 1)
          echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV

      - name: Get OAuth Token
        id: token
        run: |
          CLIENT_ID=$(echo "${{ secrets.CPI_CLIENT_ID }}" | tr -d '\r\n')
          CLIENT_SECRET=$(echo "${{ secrets.CPI_CLIENT_SECRET }}" | tr -d '\r\n')
          TOKEN_URL=$(echo "${{ secrets.CPI_TOKEN_URL }}" | tr -d '\r\n')

          RESPONSE=$(curl --http1.1 -s -X POST "$TOKEN_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=$CLIENT_ID" \
            -d "client_secret=$CLIENT_SECRET")

          echo "$RESPONSE"

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            exit 1
          fi

          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy
        run: |
          curl --http1.1 -X POST "${{ secrets.CPI_HOST }}/api/v1/IntegrationDesigntimeArtifacts" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}" \
            -H "Content-Type: application/zip" \
            --data-binary @"$FILE_PATH"

      - name: Activate
        run: |
          curl --http1.1 -X POST "${{ secrets.CPI_HOST }}/api/v1/IntegrationRuntimeArtifacts/${{ github.event.inputs.artifactId }}/deploy" \
            -H "Authorization: Bearer ${{ steps.token.outputs.token }}"
